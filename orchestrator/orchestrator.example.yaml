# Example orchestrator configuration. Copy to orchestrator.yaml and edit.
# Secrets use ${env:NAME} and are read from the environment (never stored here).

# One or more boards; each defines its own queues/columns. A single `board: {...}` also works.
# Tip: point `queues.author` at a dedicated trigger column (e.g. `Agent Todo`) so a human drags
# a task into it to start an agent; the claimed task then moves to `inProgress` while it runs.
boards:
  - url: http://192.168.68.51:3000
    id: esayzg
    token: ${env:KANBAN_TOKEN}
    queues:
      author: [Todo, Changes Requested]
      reviewer: [Code Review]
    inProgress: In Progress
    done: Done
    blocked: [Need Help]

# Path to the MCP capability catalog (docs/capability-compiler.md).
catalog: /etc/fleet/catalog.json

hosts:
  - name: agents.bigbox
    ssh:
      host: 192.168.68.106
      user: root
      key: ${env:FLEET_SSH_KEY}
    maxContainers: 10
    egress:
      # Admin API the orchestrator uses to register/drop each container's allowlist.
      adminUrl: http://192.168.68.106:3129
      # Proxy URL the container's opencode/git use (the host's gateway in the container net).
      proxyUrl: http://10.233.0.1:3128
      # Static allowlist: orchestrator + model provider (+ egress.allow additions).
      base: [192.168.68.51]
      noProxy: [localhost, 127.0.0.1]

# Repos keyed by board tag (repo:<name>), plus `default`.
repos:
  default:
    url: https://github.com/eyezahhhh/fleet-test.git
    dir: /root/fleet-demo

container:
  modulePath: /etc/nixos/image/fleet-agent.nix
  dns: [1.1.1.1, 8.8.8.8]
  port: 4096

model:
  provider: router
  id: basic

agents:
  default: build

limits:
  maxContainers: 10
  providerConcurrency: 4
  mcpConcurrency: 5

review:
  maxRounds: 3

observability:
  eventsPath: /var/log/fleet/events.jsonl
  statusPort: 4000
